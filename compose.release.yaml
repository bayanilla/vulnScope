# VulnScope MAX + Zeek, ready-made image: nothing to build. Put this file in a folder of its own,
# next to a .env copied from env.example (or the repository's .env.example), then:
#
#   docker compose pull                  # download the image (first time and to update)
#   docker compose up -d                 # start the upload page
#   open http://127.0.0.1:8765/          # Windows: start http://127.0.0.1:8765/
#   docker compose run --rm vulnscope analyze /data/case1 -o /runs/case1
#   docker compose down
#
# Pin a version with VULNSCOPE_IMAGE=ghcr.io/bayanilla/vulnscope-max:1.2.0 in .env.
# Offline: `docker load -i vulnscope-max-<version>-image-<arch>.tar.gz`, then `docker compose up -d`.
# The services below must stay the same as compose.yaml apart from image/build/pull_policy
# (tests/test_release.py checks this).
# Its own project name, so it never replaces a container started from a source checkout.
name: vulnscope-release

services:
  vulnscope:
    image: ${VULNSCOPE_IMAGE:-ghcr.io/bayanilla/vulnscope-max:latest}
    pull_policy: missing            # fetched only by `docker compose pull` or when not loaded yet
    restart: unless-stopped
    ports:
      # Loopback only: the upload page can read every folder mounted below and has no login.
      # Do not change this to 0.0.0.0; for a shared server see "Upload page security" in ARCHITECTURE.md.
      - "127.0.0.1:${VULNSCOPE_PORT:-8765}:8080"   # this computer : inside the container (keep 8080)
    environment:
      VULNSCOPE_PUBLIC_PORT: "${VULNSCOPE_PORT:-8765}"
      VULNSCOPE_OFFLINE: "${VULNSCOPE_OFFLINE:-0}"
      VULNSCOPE_DUCKDB_MEMORY: "${VULNSCOPE_DUCKDB_MEMORY:-}"
      VULNSCOPE_PARSE_WORKERS: "${VULNSCOPE_PARSE_WORKERS:-}"
      VULNSCOPE_NORMALIZED_COPIES: "${VULNSCOPE_NORMALIZED_COPIES:-1}"
      # Folders the Browse button may show: the shared computer folder first, then /data.
      VULNSCOPE_DATA_ROOT: "${VULNSCOPE_BROWSE_AT:-${VULNSCOPE_BROWSE:-${HOME:-/host}}}:/data"
      # The same folder as the computer names it, so pasted paths (C:\Users\you\...) also work.
      VULNSCOPE_HOST_ROOT: "${VULNSCOPE_BROWSE:-${HOME:-${USERPROFILE:-}}}"
    volumes:
      - "${VULNSCOPE_DATA:-./data}:/data:ro"     # logs, scans and PCAPs, read-only
      # Your home folder (or VULNSCOPE_BROWSE), read-only. macOS/Linux: at the same path, so Browse
      # shows /Users/you or /home/you. Windows (no HOME, uses USERPROFILE): at /host.
      - "${VULNSCOPE_BROWSE:-${HOME:-${USERPROFILE:-./data}}}:${VULNSCOPE_BROWSE_AT:-${VULNSCOPE_BROWSE:-${HOME:-/host}}}:ro"
      - "${VULNSCOPE_RUNS:-./vulnscope-out}:/runs" # results and temporary files: needs free space
    mem_limit: ${VULNSCOPE_MEMORY:-0}             # 0 = no limit beyond Docker's own
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]               # entry point only: fix /runs owner, then drop root
