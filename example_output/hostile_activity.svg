<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1050 740" width="1050" height="740" role="img" aria-label="Hostile activity against vulnerable services" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12">
<style>
.dg-bg{fill:var(--panel,#111c31)}.dg-ink{fill:var(--fg,#f1f5f9)}.dg-ink2{fill:var(--muted,#cbd5e1)}
