# Longer fuzzing of every input reader than the short run in CI (tests/test_fuzz_parsers.py with
# FUZZ_PROFILE=long: about 25 times more generated files per test, new random inputs each run).
# Runs every Monday and on demand: Actions > Fuzz parsers (long) > Run workflow.
# A failure prints the smallest input that breaks a reader and a @reproduce_failure line to replay it.
name: Fuzz parsers (long)

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FUZZ_PROFILE: long
      VULNFLOW_LLM_PROVIDER: offline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - run: python -m unittest -v tests.test_fuzz_parsers
