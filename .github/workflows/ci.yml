# Runs on every pull request and every push to main. Seven jobs run side by side:
#   hygiene       scripts/check_repo.py: no local branding, captures, executables, keys or files over 5 MB
#   lint          ruff (unused/undefined names, syntax) and mypy checked against Python 3.10 (pyproject.toml)
#   tests         the unit test suite on Python 3.10 (oldest supported) and 3.13 (the Docker image's),
#                 including the parser fuzz tests (short profile) and the correlation accuracy kit;
#                 the 3.13 run measures coverage and shows it on the run's summary page
#   performance   scripts/perf/perf_check.py: a fixed dataset, fails on a big slowdown, memory or page-size growth
#   explorer      scripts/smoke/explorer_smoke.py: opens each sample's Explorer in headless Chromium, walks
#                 3D, focus, Flat, Attack paths and Timeline, fails on page errors or hosts/flows not drawn
#   docker-image  builds the Docker image, analyzes a bundled sample inside it, scans it with Grype
#                 (warning only) and keeps its SBOM
#   accuracy      runs the image on Brim's public sample captures and logs and compares every
#                 number with ground truth computed separately (scripts/accuracy/)
# Nothing here needs secrets, an API key or a model. The Brim files are downloaded on the CI
# machine, pinned to exact commits and SHA-256 checked; they are never committed or put in the image.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:          # the Release workflow runs all of this before publishing an image

permissions:
  contents: read

# A new push to the same PR cancels the run still going for the old one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_repo.py

  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: ruff
        run: ruff check --output-format=github .
      - name: mypy (Python 3.10 rules)
        run: mypy

  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    env:
      VULNFLOW_LLM_PROVIDER: offline     # never reach for an AI provider
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Run tests
        if: matrix.python != '3.13'
        run: python -m unittest discover -s tests
      - name: Run tests with coverage
        if: matrix.python == '3.13'
        run: |
          coverage run -m unittest discover -s tests
          coverage combine
          coverage report
          { echo "### Test coverage (vulnflow/)"; echo; coverage report --format=markdown; } >> "$GITHUB_STEP_SUMMARY"
          coverage html -d coverage-html
      - name: Keep the coverage report
        if: matrix.python == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage-html/
          retention-days: 14

  performance:
    name: Performance check (fixed dataset)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Analyze the fixed dataset and compare with scripts/perf/baseline.json
        run: python scripts/perf/perf_check.py

  explorer:
    name: Explorer pages open and draw (headless Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VULNFLOW_LLM_PROVIDER: offline
      VULNSCOPE_OFFLINE: "1"             # no article previews from the network
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install --disable-pip-version-check -r requirements.txt playwright==1.63.0
      - run: python -m playwright install --with-deps chromium
      - name: Open every view of each sample's Explorer
        run: python scripts/smoke/explorer_smoke.py --samples smoke-work
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: explorer-screenshots
          path: smoke-work/smoke-shots/
          retention-days: 7

  docker-image:
    name: Docker image builds and runs
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: vulnscope:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Zeek and DuckDB are inside
        run: |
          docker run --rm vulnscope:ci zeek --version
          docker run --rm --entrypoint python3 vulnscope:ci -c "import duckdb; print('duckdb', duckdb.__version__)"
      - name: Analyze the Gootloader sample in the container
        run: |
          mkdir -p runs
          docker run --rm -v "$PWD/runs:/runs" vulnscope:ci \
            analyze /opt/vulnscope/samples/gootloader_seo_poisoning -o /runs/demo
          test -s runs/demo/results.json
          test -s runs/demo/explorer.html
      - name: Upload page answers
        run: |
          docker run -d --name vs -p 127.0.0.1:8080:8080 vulnscope:ci
          for i in $(seq 30); do curl -fs -o /dev/null http://127.0.0.1:8080/ && exit 0; sleep 2; done
          docker logs vs; exit 1
      # Warning only here; the Release workflow fails on the same findings before publishing.
      - uses: anchore/scan-action/download-grype@v6
        id: grype
      - name: Known vulnerabilities with a fix (warning only; Release blocks on these)
        run: |
          if ! "${{ steps.grype.outputs.cmd }}" vulnscope:ci --only-fixed --fail-on high -o table -o json=grype.json > grype.txt; then
            echo "::warning title=Image scan::HIGH or CRITICAL findings with a fix available; the Release workflow would stop on these"
          fi
          cat grype.txt
          # Where each blocking finding lives in the image, to tell base-image packages from our own.
          jq -r '.matches[] | select(.vulnerability.fix.state == "fixed")
                 | select(.vulnerability.severity == "High" or .vulnerability.severity == "Critical")
                 | "\(.artifact.name) \(.artifact.version) -> \(.vulnerability.fix.versions | join(",")) \(.artifact.locations[0].path)"' \
            grype.json | sort -u | tee blocking.txt
          { echo "### Image scan (Grype): fixable HIGH/CRITICAL, which stop a release"; echo; echo '```';
            if [ -s blocking.txt ]; then cat blocking.txt; else echo "none"; fi; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: anchore/sbom-action/download-syft@v0
        id: syft
      - name: SBOM of the image (the same command the Release workflow uses)
        run: '"${{ steps.syft.outputs.cmd }}" docker:vulnscope:ci -q -o spdx-json=vulnscope-sbom-amd64.spdx.json'
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-amd64
          path: vulnscope-sbom-amd64.spdx.json
          retention-days: 7

  accuracy:
    name: Accuracy on Brim sample data
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: vulnscope:ci
          cache-from: type=gha
      - name: Cache the Brim files (verified again after restore)
        uses: actions/cache@v4
        with:
          path: brim-data
          key: brim-${{ hashFiles('scripts/accuracy/brim_manifest.txt') }}
      - name: Download, analyze and compare
        run: scripts/accuracy/run.sh brim-data accuracy-work
      - name: Keep the outputs when a check fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: accuracy-results
          path: |
            accuracy-work/runs/*.log
            accuracy-work/runs/*/results.json
          retention-days: 7
